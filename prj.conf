#prj.cjnf v21stabil-2679
CONFIG_SPI=y
CONFIG_SPI_STM32=y
CONFIG_PINCTRL=y
CONFIG_DMA=y
CONFIG_SPI_ASYNC=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Включаем подсистему высокоуровневого ввода
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y

# Включаем сетевую подсистему и драйвер Ethernet stm32
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_STM32_HAL=y

# Базовые настройки IP-стека
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y

# Статический IP (удобно для тестов Modbus)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.97"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Включаем подсистему энтропии и драйвер аппаратного RNG STM32
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=y

# Разрешаем сетевому стеку использовать генератор случайных чисел
CONFIG_TEST_RANDOM_GENERATOR=n


# Проверяем, что Modbus сконфигурирован правильно под сетевой стек
#CONFIG_MODBUS_RAW_ADU=y
#==
# Включаем сетевые буферы и увеличиваем их количество под TCP
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=40

# Максимальное число сетевых контекстов и соединений
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=8

# Выделяем оперативную память под стек обработки входящих пакетов
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# Убеждаемся, что стек Modbus сконфигурирован правильно
CONFIG_MODBUS_RAW_ADU=y

#==

# Включаем подсистему Modbus и роль сервера
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_LOG_LEVEL_DBG=y

# Исправленные конфигурации для Modbus TCP в вашей версии Zephyr
CONFIG_MODBUS_RAW_ADU=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1

# Активируем сетевой бэкенд Modbus (мост между сокетами и Modbus API)
#CONFIG_MODBUS_SERVER_NET=y

# Явно задаем порт по умолчанию (хотя 502 применится и сам)
#CONFIG_MODBUS_SERVER_PORT=502
# Активируем BSD-совместимый API сокетов в Zephyr
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y



# Настройки системного лога
CONFIG_LOG=y
CONFIG_NET_LOG=y

#CONFIG_CPP=y
#CONFIG_STD_CPP17=y # Или CPP17 / CPP23 в зависимости от версии Zephyr
# Включение поддержки C++ в Zephyr RTOS
CONFIG_CPP=y

# Выбор стандарта языка (рекомендуется CPP20 для полноценной работы)
CONFIG_STD_CPP20=y

# Разрешить использование базовых функций стандартной библиотеки C++
CONFIG_GLIBCXX_LIBCPP=y

CONFIG_SHELL=y


# Включаем консоль управления (Shell) и сетевые команды
#CONFIG_SHELL=y
#CONFIG_NET_SHELL=y

# Дополнительные логи для отладки Ethernet и PHY-чипа
